spring:
  application:
    name: tablet-backend

  config:
    import: "optional:file:.env[.properties]"

  codec:
    max-in-memory-size: 20MB

  webflux:
    multipart:
      max-in-memory-size: 20MB

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tablet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      validation-query: SELECT 1

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

azure:
  document-intelligence:
    endpoint: ${AZURE_DI_ENDPOINT}
    key: ${AZURE_DI_KEY}
    model-id: ${AZURE_DI_MODEL_ID:prebuilt-layout}
    api-version: ${AZURE_DI_API_VERSION:2024-11-30}
    max-poll-attempts: ${AZURE_DI_MAX_POLL_ATTEMPTS:30}
    poll-interval-ms: ${AZURE_DI_POLL_INTERVAL_MS:2000}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    key: ${AZURE_OPENAI_KEY}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4o-mini}
    api-version: ${AZURE_OPENAI_API_VERSION:2024-10-21}
    max-tokens: ${AZURE_OPENAI_MAX_TOKENS:4096}
    temperature: ${AZURE_OPENAI_TEMPERATURE:0.3}

server:
  port: ${PORT:${SERVER_PORT:8080}}

logging:
  level:
    root: INFO
    com.tablet.backend: DEBUG
    org.springframework.r2dbc: DEBUG

---
spring:
  config:
    activate:
      on-profile: local

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgre

logging:
  level:
    com.tablet.backend: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 10
      max-size: 50

logging:
  level:
    root: WARN
    com.tablet.backend: INFO
